name: Astro build check

on:
  push:
    branches:
      - agent/astro-personal-os-foundation
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build Astro site
        run: npm run build
      - name: Upload static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-static-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14
